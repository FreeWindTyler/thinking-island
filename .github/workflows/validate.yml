name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run release audit
        run: npm run release:audit

      - name: Run application preflight
        run: npm run application:preflight
