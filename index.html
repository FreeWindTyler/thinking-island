<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>思维小岛 | 小学数学思维训练</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div>
          <p class="eyebrow">小学数学思维训练</p>
          <h1>思维小岛</h1>
        </div>
        <div class="stats" aria-label="学习进度">
          <div class="stat">
            <span id="streak">0</span>
            <small>连续天数</small>
          </div>
          <div class="stat">
            <span id="xp">0</span>
            <small>经验值</small>
          </div>
          <div class="stat">
            <span id="stars">0</span>
            <small>星星</small>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="lesson-map" aria-labelledby="map-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">今日路线</p>
              <h2 id="map-title">当前开放：一年级基础路线</h2>
            </div>
            <button id="reset-progress" class="ghost-button" type="button">重置进度</button>
          </div>
          <div id="lesson-list" class="lesson-list"></div>
          <div id="progress-dashboard" class="progress-dashboard" aria-live="polite"></div>
        </section>

        <section class="practice-panel" aria-labelledby="practice-title">
          <div class="section-heading">
            <div>
              <p id="lesson-label" class="eyebrow">欢迎上岛</p>
              <h2 id="practice-title">用 5 分钟热身思维</h2>
            </div>
            <span id="question-count" class="progress-pill">0 / 0</span>
          </div>

          <div class="meter" aria-label="本关进度">
            <div id="progress-fill" class="meter-fill"></div>
          </div>

          <div id="question-card" class="question-card">
            <p class="prompt-kicker">请选择一个关卡</p>
            <h3>适合 1-3 年级逐步练习，当前从一年级基础开始。</h3>
            <p class="support-text">
              题目会训练数感、规律、比较、应用建模和空间观察。答案存在本机浏览器中，适合孩子每天短时间练习。
            </p>
          </div>

          <div id="choices" class="choices"></div>
          <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

          <div class="action-row">
            <button id="start-button" class="primary-button" type="button">开始第一关</button>
            <button id="review-button" class="secondary-button hidden" type="button">复习错题</button>
            <button id="next-button" class="primary-button hidden" type="button">下一题</button>
          </div>
        </section>
      </main>
    </div>

    <script src="data/lessons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
